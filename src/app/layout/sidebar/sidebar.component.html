<div class="sidebar d-flex flex-column vh-100 position-fixed">
    <!-- Logo/Header -->
    <div class="p-4 border-bottom sidebar-header">
      <div class="d-flex align-items-center">
        <div class="rounded-circle me-3 d-flex align-items-center justify-content-center logo-icon-wrapper">
          <svg width="24" height="24" viewBox="0 0 24 24">
            <path d="M12 2C13.1 2 14 2.9 14 4C14 5.1 13.1 6 12 6C10.9 6 10 5.1 10 4C10 2.9 10.9 2 12 2ZM21 9V7L15 1H5C3.89 1 3 1.89 3 3V21C3 22.11 3.89 23 5 23H19C20.11 23 21 22.11 21 21V9M19 9H14V4H19V9Z" />
          </svg>
        </div>
        <div>
          <h5 class="mb-0 fw-bold">Sistema</h5>
          <small class="text-muted">Estudiantes</small>
        </div>
      </div>
    </div>
  
    <!-- Navigation Menu -->
    <nav class="flex-grow-1 p-3">
      <ul class="nav flex-column gap-1">
        <li class="nav-item">
          <a routerLink="/dashboard" routerLinkActive="sidebar-active" class="nav-link d-flex align-items-center py-3 px-3 rounded text-decoration-none">
            <svg width="20" height="20" fill="currentColor" class="me-3" viewBox="0 0 24 24">
              <path d="M13,3V9H21V3M13,21H21V11H13M3,21H11V15H3M3,13H11V3H3V13Z" />
            </svg>
            <span class="fw-medium">Dashboard</span>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/students" routerLinkActive="sidebar-active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link d-flex align-items-center py-3 px-3 rounded text-decoration-none">
            <svg width="20" height="20" fill="currentColor" class="me-3" viewBox="0 0 24 24">
              <path d="M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z" />
            </svg>
            <span class="fw-medium">Estudiantes</span>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/students/new" routerLinkActive="sidebar-active" class="nav-link d-flex align-items-center py-3 px-3 rounded text-decoration-none">
            <svg width="20" height="20" fill="currentColor" class="me-3" viewBox="0 0 24 24">
              <path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" />
            </svg>
            <span class="fw-medium">Nuevo Estudiante</span>
          </a>
        </li>
        <li class="nav-item mt-4">
          <hr class="sidebar-divider">
        </li>
        <li class="nav-item">
          <a routerLink="/reports" routerLinkActive="sidebar-active" class="nav-link d-flex align-items-center py-3 px-3 rounded text-decoration-none">
            <svg width="20" height="20" fill="currentColor" class="me-3" viewBox="0 0 24 24">
              <path d="M19,3H5C3.9,3 3,3.9 3,5V19C3,20.1 3.9,21 5,21H19C20.1,21 21,20.1 21,19V5C21,3.9 20.1,3 19,3M19,19H5V5H19V19M17,12H15V17H17V12M13,7H11V17H13V7M9,10H7V17H9V10Z" />
            </svg>
            <span class="fw-medium">Reportes</span>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/settings" routerLinkActive="sidebar-active" class="nav-link d-flex align-items-center py-3 px-3 rounded text-decoration-none">
            <svg width="20" height="20" fill="currentColor" class="me-3" viewBox="0 0 24 24">
              <path d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.34 19.43,11L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.96 19.05,5.05L16.56,6.05C16.04,5.66 15.5,5.32 14.87,5.07L14.5,2.42C14.46,2.18 14.25,2 14,2H10C9.75,2 9.54,2.18 9.5,2.42L9.13,5.07C8.5,5.32 7.96,5.66 7.44,6.05L4.95,5.05C4.73,4.96 4.46,5.05 4.34,5.27L2.34,8.73C2.22,8.95 2.27,9.22 2.46,9.37L4.57,11C4.53,11.34 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.22,15.05 2.34,15.27L4.34,18.73C4.46,18.95 4.73,19.03 4.95,18.95L7.44,17.94C7.96,18.34 8.5,18.68 9.13,18.93L9.5,21.58C9.54,21.82 9.75,22 10,22H14C14.25,22 14.46,21.82 14.5,21.58L14.87,18.93C15.5,18.68 16.04,18.34 16.56,17.94L19.05,18.95C19.27,19.03 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z" />
            </svg>
            <span class="fw-medium">Configuración</span>
          </a>
        </li>
      </ul>
    </nav>
  
    <!-- User Profile & Logout -->
    <div class="p-3 border-top sidebar-divider">
      <div class="d-flex align-items-center mb-3">
        <div class="rounded-circle me-3 d-flex align-items-center justify-content-center user-avatar-wrapper">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path d="M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z" />
          </svg>
        </div>
        <div class="flex-grow-1">
          <div class="fw-medium small">{{ currentUser?.name || 'Usuario' }}</div>
          <div class="text-muted user-email">{{ currentUser?.email }}</div>
        </div>
      </div>
      <button (click)="logout()" class="btn w-100 d-flex align-items-center justify-content-center py-2 logout-btn">
        <svg width="16" height="16" fill="currentColor" class="me-2" viewBox="0 0 24 24">
          <path d="M16,17V14H9V10H16V7L21,12L16,17M14,2A2,2 0 0,1 16,4V6H14V4H5V20H14V18H16V20A2,2 0 0,1 14,22H5A2,2 0 0,1 3,20V4A2,2 0 0,1 5,2H14Z" />
        </svg>
        <span class="fw-medium">Cerrar Sesión</span>
      </button>
    </div>
  </div>
